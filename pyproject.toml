[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wind-turbine-pm"
version = "1.0.0"
description = "Wind Turbine Predictive Maintenance Platform with failure, health, anomaly and maintenance decision support"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Ozan Sunger" },
    { name = "Sahin Birkanli" },
    { name = "Emir Dikmen" },
]
keywords = ["predictive-maintenance", "wind-turbine", "scada", "machine-learning"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.1,<3.0",
    "scipy>=1.14,<2.0",
    "pyarrow>=15.0",
    "scikit-learn>=1.4,<2.0",
    "joblib>=1.3",
    "shap>=0.48",
    "PyYAML>=6.0",
    "pydantic>=2.6,<3.0",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "streamlit>=1.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "ruff>=0.4",
    "pre-commit>=3.6",
]

[project.urls]
Repository = "https://github.com/SEO-Dynamics/Wind-Turbine-Predictive-Maintenance-Platform"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wind_turbine_pm = ["py.typed"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests", "dashboard"]
exclude = [".venv", "data", "artifacts", "notebooks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "PTH", # use pathlib
    "RET", # return statements
    "ARG", # unused arguments
]
ignore = [
    "E501",   # line length handled by formatter
    "B905",   # zip strict= (py>=3.10 only concern for libs)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]
"dashboard/*" = ["E402"]
"scripts/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
