name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

permissions:
  contents: read

jobs:
  quality:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      # The suite builds its own small fixtures and never trains a
      # production-scale model, so it runs in seconds on every commit.
      - name: Pytest
        run: pytest -q --maxfail=1

      - name: FastAPI import test
        run: python -c "from wind_turbine_pm.api.main import app; print(app.title)"

      - name: Dashboard import test
        run: |
          python -c "
          import dashboard.app as app
          available = [p.label for p in app.PAGES if p.available]
          print(len(app.PAGES), 'dashboard pages;', len(available), 'available:', available)
          assert 'Turbine Health Monitoring' in available, available
          assert 'Anomaly & Maintenance' in available, available
          "

      - name: API health check (no model artifacts present)
        # Verifies the documented degraded-mode contract: the API must start and
        # answer /health even when no model has been trained.
        run: |
          python -m uvicorn wind_turbine_pm.api.main:app --host 127.0.0.1 --port 8000 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health > health.json; then break; fi
            sleep 1
          done
          cat health.json
          python -c "
          import json, sys
          body = json.load(open('health.json'))
          assert body['status'] in ('ok', 'degraded'), body
          assert 'model_loaded' in body, body
          # Every module must report its own artifact status, and each must be
          # able to serve independently of the other.
          modules = body['modules']
          for name in (
              'failure_prediction',
              'turbine_health_monitoring',
              'anomaly_detection',
              'unified_maintenance_decision',
          ):
              assert name in modules, modules
              assert 'model_loaded' in modules[name], modules[name]
          print('health OK:', body['status'], {k: v['model_loaded'] for k, v in modules.items()})
          "

      - name: Smoke-test the pipeline on a tiny dataset
        # Exercises every stage end to end (generate -> prepare -> train ->
        # evaluate) without a full training run on every commit.
        #
        # The dataset must be large enough that failures reach *every*
        # chronological split: with too few turbines or months they all land in
        # the training period, validation and test end up with no positive
        # labels, and model selection correctly refuses to publish anything.
        # 6 turbines x 6 months at an elevated event rate gives ~960/157/288
        # positives across train/valid/test.
        if: matrix.python-version == '3.13'
        run: |
          python scripts/generate_synthetic_data.py --turbines 6 --months 6 --failures-per-year 12 --force
          python scripts/prepare_data.py --force --strict
          python scripts/train_failure_model.py
          python scripts/evaluate_failure_model.py --explain-samples 200
          test -f artifacts/models/failure_model.joblib
          test -f artifacts/metadata/failure_model_metadata.json
          test -f artifacts/metadata/failure_threshold.json
          test -f artifacts/metrics/failure_metrics.json
          echo "Pipeline smoke test passed"

      - name: Smoke-test the health pipeline on the same dataset
        # Runs against the dataset the failure smoke test just generated, without
        # --force, which is what proves the modules describe the same fleet
        # rather than each regenerating their own.
        if: matrix.python-version == '3.13'
        run: |
          python scripts/run_health_pipeline.py --strict
          test -f artifacts/models/health_model.joblib
          test -f artifacts/models/health_drift_detector.joblib
          test -f artifacts/metadata/health_model_metadata.json
          test -f artifacts/metrics/health_metrics.json
          test -f data/processed/health_dataset.parquet
          test -f data/processed/health_features.parquet
          echo "Health pipeline smoke test passed"

      - name: Verify the drift detector is calibrated and discriminating
        # Regression guard for a defect that made the module quietly useless: with
        # an un-reset CUSUM and textbook control limits, 92% of all observations
        # took the maximum drift penalty. A deduction that applies almost
        # everywhere is a constant offset on every health score, not a signal.
        if: matrix.python-version == '3.13'
        run: |
          python -c "
          import json, pandas as pd
          from wind_turbine_pm.health.config import load_health_config
          from wind_turbine_pm.services.health_monitoring_service import HealthMonitoringService
          from wind_turbine_pm.utils.io import read_table

          cfg = load_health_config()
          service = HealthMonitoringService(cfg)
          assert service.is_ready, service.status().detail

          calibration = service.drift_calibration
          assert calibration is not None, 'the artifact carries no drift calibration'
          assert calibration.warning_at, 'no CUSUM thresholds were fitted'
          assert calibration.ewma_warning_at, 'no EWMA thresholds were fitted'

          dataset = read_table('data/processed/health_dataset.parquet')
          features = read_table('data/processed/health_features.parquet')
          scored = service.score_frame(dataset, features)
          penalty = scored['raw_health_score'] - scored['health_score']
          cap = float(cfg.get('health.drift.penalty.max_points', 15.0))
          saturated = float((penalty >= cap - 1e-6).mean())
          print(f'drift penalty: mean={penalty.mean():.2f}, {saturated:.1%} at the cap')
          assert saturated < 0.5, f'{saturated:.1%} of rows take the maximum drift penalty'
          "

      - name: Smoke-test the anomaly pipeline on the same dataset
        if: matrix.python-version == '3.13'
        run: |
          python scripts/run_anomaly_pipeline.py --strict
          test -f artifacts/models/anomaly_model.joblib
          test -f artifacts/models/anomaly_reference.parquet
          test -f artifacts/metadata/anomaly_model_metadata.json
          test -f artifacts/metadata/anomaly_score_calibration.json
          test -f artifacts/metrics/anomaly_metrics.json
          test -f data/processed/anomaly_dataset.parquet
          test -f data/processed/anomaly_features.parquet

      - name: Verify measured healthy anomaly alert rates
        if: matrix.python-version == '3.13'
        run: |
          python -c "
          import json
          document = json.load(open('artifacts/metrics/anomaly_metrics.json'))
          calibration = document['calibration']
          warning = calibration['achieved_warning_rate']
          alarm = calibration['achieved_alarm_rate']
          print(f'healthy alert rates: warning={warning:.2%}, alarm={alarm:.2%}')
          assert 0.035 <= warning <= 0.065, warning
          assert 0.004 <= alarm <= 0.016, alarm
          "

      - name: Health API check
        if: matrix.python-version == '3.13'
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from wind_turbine_pm.api.main import app

          client = TestClient(app)
          body = client.get('/health').json()
          assert body['modules']['turbine_health_monitoring']['model_loaded'], body
          example = client.get('/health-monitoring/example').json()
          response = client.post('/health-monitoring/assess', json=example['window_request'])
          assert response.status_code == 200, response.text
          assessment = response.json()
          assert assessment['advisory_only'] is True
          # The documented example must not look pathological.
          assert assessment['data_quality'] > 0.9, assessment['data_quality']
          print('health assess OK:', assessment['health_score'], assessment['health_class'])
          "

      - name: Anomaly and maintenance API check
        if: matrix.python-version == '3.13'
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from wind_turbine_pm.api.main import app

          client = TestClient(app)
          health = client.get('/health').json()
          assert health['modules']['anomaly_detection']['model_loaded'], health
          example = client.get('/anomaly/example').json()['window_request']
          anomaly = client.post('/anomaly/detect', json=example)
          assert anomaly.status_code == 200, anomaly.text
          assessment = client.post('/maintenance/assess', json=example)
          assert assessment.status_code == 200, assessment.text
          body = assessment.json()
          assert body['advisory_only'] is True
          assert body['coverage'] == 1.0, body
          assert set(body['component_scores']) == {'failure', 'anomaly', 'health'}, body
          print('maintenance assess OK:', body['risk_level'], body['recommendation']['action'])
          "

      - name: Re-run the artifact-dependent tests
        # Many tests skip in the run above because no model exists yet - and they
        # are the ones that matter most: real predictions, batch scoring,
        # explanation schema, risk-band mapping, health assessments, the drift
        # calibration and runtime/artifact version compatibility. Now that both
        # smoke tests have produced artifacts, run them for real so CI actually
        # validates trained models end to end.
        if: matrix.python-version == '3.13'
        run: |
          pytest -q tests/test_prediction_service.py tests/test_failure_api.py \
            tests/test_health_service.py tests/test_health_api.py \
            tests/test_anomaly_service.py tests/test_anomaly_api.py \
            tests/test_maintenance_service.py tests/test_maintenance_api.py \
            -p no:randomly \
            | tee pytest-artifacts.log
          if grep -qE "[0-9]+ skipped" pytest-artifacts.log; then
            echo "::error::Artifact-dependent tests still skipped - artifacts were not picked up"
            exit 1
          fi

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-${{ matrix.python-version }}
          path: |
            artifacts/
            health.json
          retention-days: 5
          if-no-files-found: ignore

  security:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install locked security tooling
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt

      - name: Audit the locked runtime dependency graph
        run: python -m pip_audit --disable-pip --no-deps -r requirements.txt

      - name: Scan Python sources
        run: python -m bandit -q -r src scripts dashboard

  docker:
    name: Docker build validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Validate the compose file
        run: docker compose config --quiet

      - name: Build the image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: false
          load: true
          tags: wind-turbine-pm:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the runtime excludes build and test tooling
        run: |
          docker run --rm --entrypoint sh wind-turbine-pm:ci -c '
            ! command -v cc &&
            ! command -v gcc &&
            ! command -v curl &&
            ! python -c "import bandit" 2>/dev/null &&
            ! python -c "import pytest" 2>/dev/null
          '

      - name: Scan the image for fixable high and critical CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: wind-turbine-pm:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library

      - name: Verify the image starts and serves /health
        run: |
          docker run -d --name wtpm-ci -p 127.0.0.1:8000:8000 wind-turbine-pm:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              echo "\nContainer healthy"
              docker rm -f wtpm-ci
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy"
          docker logs wtpm-ci
          docker rm -f wtpm-ci
          exit 1
